<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exodus - عجلة الحظ التفاعلية</title>
    <style>
        :root {
            --bg-color: #0b0b16;
            --card-bg: #12122c;
            --accent-color: #ff9f1c;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .logo-text {
            color: var(--accent-color);
            font-size: 38px;
            font-weight: bold;
            margin: 5px 0 0 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,159,28,0.4);
        }

        .sub-title {
            color: #ffffff;
            font-size: 20px;
            margin: 0 0 20px 0;
            opacity: 0.9;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }

        .wheel-container {
            position: relative;
            margin: 30px auto;
            width: 360px;
            height: 360px;
        }

        /* سهم المؤشر العلوي الثابت بدقة */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,0.8), 0 0 50px rgba(255,159,28,0.15);
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.1, 1);
        }

        button {
            background: linear-gradient(45deg, #ff9f1c, #ff4b5c);
            border: none;
            color: #ffffff;
            padding: 15px 45px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,159,28,0.4);
            transition: 0.3s ease;
            margin-top: 15px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(255,159,28,0.6);
        }

        button:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 20;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,159,28,0.2);
            border: 2px solid var(--accent-color);
            animation: fadeIn 0.5s ease;
        }

        .category-title {
            font-size: 20px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,159,28,0.2);
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 24px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background-color: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 12px;
            font-size: 19px;
            cursor: pointer;
            text-align: right;
            transition: 0.2s;
        }

        .option-btn:hover {
            background-color: rgba(255,159,28,0.15);
            border-color: var(--accent-color);
        }

        .option-btn.correct {
            background-color: #21bf73 !important;
            border-color: #21bf73 !important;
            color: white;
        }

        .option-btn.wrong {
            background-color: #ff4b5c !important;
            border-color: #ff4b5c !important;
            color: white;
        }

        .feedback-text {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            min-height: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="logo-text">Єxodus</div>
    <div class="sub-title">شباب خريجين موسى النبي</div>

    <div class="container">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="360" height="360"></canvas>
        </div>
        <button id="spinBtn" onclick="spinWheel()">ابدأ الدوران! 🎡</button>
    </div>

    <div id="quizModal" class="modal">
        <div class="modal-content">
            <div id="modalCategory" class="category-title"></div>
            <div id="modalQuestion" class="question-text"></div>
            <div id="modalOptions" class="options-container"></div>
            <div id="modalFeedback" class="feedback-text"></div>
            <button id="nextBtn" style="display:none; margin: 25px auto 0;" onclick="closeModal()">العودة للعجلة 🔄</button>
        </div>
    </div>

    <script>
        // الأقسام الخمسة الحالية
        const categories = ["رياضي", "know yourself", "جغرافيا", "معلومات تاريخية", "ضربة حظ"];
        // ألوان متناسقة وفخمة مع الـ Theme الداكن
        const colors = ["#ff4b5c", "#711c91", "#0abf53", "#ff9f1c", "#00fff0"];
        
        // استدعاء مؤثرات صوتية حقيقية ومباشرة من السيرفر لتخطي حجب المتصفحات
        const tickSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav");
        const winSound = new Audio("https://assets.mixkit.co/active_storage/sfx/1435/1435-84.wav");
        const loseSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2958/2958-84.wav");

        const quizBank = {
            "know yourself": [
                { q: "المشاعر هي:", options: ["أفكار منطقية عن الموقف", "استجابات جسدية ونفسية نمر بها تجاه موقف أو شخص", "قرارات نتخذها بإرادتنا", "حقائق علمية"], answer: "استجابات جسدية ونفسية نمر بها تجاه موقف أو شخص" },
                { q: "الفرق الأساسي بين 'الفكرة' و 'الشعور' إن:", options: ["الاثنين نفس الشيء", "الفكرة في الرأس، والشعور في الجسم", "الشعور دايمًا صح والفكرة دايمًا غلط", "الفكرة تأخذ وقت والشعور لا"], answer: "الفكرة في الرأس، والشعور في الجسم" },
                { q: "من المشاعر الأساسية الـ 6 حسب علم النفس:", options: ["الملل - الفضول - الندم", "الفرح - الحزن - الغضب - الخوف - الاشمئزاز - المفاجأة", "الثقة - الغيرة - الطمع", "الحماس - التوتر - الكسل"], answer: "الفرح - الحزن - الغضب - الخوف - الاشمئزاز - المفاجأة" },
                { q: "أي من التالي يعتبر شعور إيجابي؟", options: ["القلق", "الامتنان", "الإحباط", "الرفض"], answer: "الامتنان" },
                { q: "المشاعر بتأثر على سلوكنا إزاي؟", options: ["مش بتأثر خالص", "بتخلينا نتصرف بدون ما نفكر في النتائج", "بتحدد طريقة كلامنا وقراراتنا وردود أفعالنا", "بتوقف تفكيرنا تمامًا"], answer: "بتحدد طريقة كلامنا وقراراتنا وردود أفعالنا" }
            ],
            "رياضي": [
                { q: "ما هو المنتخب الأكثر تتويجاً ببطولة كأس العالم؟", options: ["البرازيل", "ألمانيا", "الأرجنتين", "إيطاليا"], answer: "البرازيل" },
                { q: "من هو اللاعب الأكثر تسجيلاً للأهداف في تاريخ كأس العالم؟", options: ["ميروسلاف كلوزه", "رونالدو البرازيلي", "ميسي", "بيليه"], answer: "ميروسلاف كلوزه" },
                { q: "كم عدد المنتخبات المشاركة في كأس العالم بداية من عام 2026؟", options: ["32 منتخب", "48 منتخب", "40 منتخب", "64 منتخب"], answer: "48 منتخب" },
                { q: "ما هو النادي الأكثر فوزاً ببطولة دوري أبطال أوروبا؟", options: ["ريال مدريد", "ميلان", "ليفربول", "برشلونة"], answer: "ريال مدريد" },
                { q: "من هو الهداف التاريخي لبطولة دوري أبطال أوروبا؟", options: ["كريستيانو رونالدو", "ليونيل ميسي", "كريم بنزيما", "ليفاندوفسكي"], answer: "كريستيانو رونالدو" }
            ],
            "جغرافيا": [
                { q: "ما هي أكبر دولة في العالم من حيث المساحة؟", options: ["روسيا", "كندا", "الصين", "أمريكا"], answer: "روسيا" },
                { q: "ما هو المحيط الأكبر في العالم؟", options: ["المحيط الهادئ", "المحيط الأطلسي", "المحيط الهندي", "المحيط المتجمد"], answer: "المحيط الهادئ" },
                { q: "أي دولة يمر بها خط الاستواء وتضم أعلى قمة جبلية فيها؟", options: ["الإكوادور", "البرازيل", "كينيا", "إندونيسيا"], answer: "الإكوادور" },
                { q: "كم عدد قارات العالم؟", options: ["5 قارات", "6 قارات", "7 قارات", "8 قارات"], answer: "7 قارات" }
            ],
            "معلومات تاريخية": [
                { q: "ما هو الحدث الذي يُعد الشرارة الأولى لاندلاع الحرب العالمية الأولى؟", options: ["اغتيال ولي عهد النمسا الأرشيدوق فرانز فرديناند", "غزو بولندا", "سقوط جدار برلين", "قنبلة هيروشيما"], answer: "اغتيال ولي عهد النمسا الأرشيدوق فرانز فرديناند" },
                { q: "في أي عام سقط جدار برلين؟", options: ["1985", "1989", "1991", "1995"], answer: "1989" },
                { q: "ما اسم الثورة التي أطاحت بحكم القياصرة في روسيا عام 1917؟", options: ["الثورة الفرنسية", "الثورة البلشفية", "الثورة الصناعية", "الثورة المجيدة"], answer: "الثورة البلشفية" },
                { q: "من كان أول رئيس للولايات المتحدة الأمريكية؟", options: ["جورج واشنطن", "أبراهام لينكون", "توماس جيفرسون", "جون آدامز"], answer: "جورج واشنطن" },
                { q: "ما هي المعركة التي انتهت بهزيمة نابليون بونابرت نهائياً عام 1815؟", options: ["معركة واترلو", "معركة ماراثون", "معركة ترالفالجار", "معركة ليبزيج"], answer: "معركة واترلو" }
            ],
            "ضربة حظ": [
                { q: "سمّع مزمور: اللهم تراءف عليَّ يا الله كعظيم رحمتك. 🙏" },
                { q: "قل أسماء 5 شخصيات كتابية في 10 ثوانٍ. ⏱️" },
                { q: "اعمل تمثال لمدة 15 ثانية. 🗿" },
                { q: "اتكلم كأنك مذيع نشرة أخبار لمدة دقيقة. 🎙️" },
                { q: "قول آية تحفظها من غير ما تتردد. 📖" },
                { q: "امشِ كأنك روبوت حتى نهاية الجولة. 🤖" },
                { q: "اعمل صوت ديك 3 مرات. 🐓" },
                { q: "قل أسماء 5 أسفار من الكتاب المقدس بسرعة. 📚" },
                { q: "اتكلم بالفصحى للسؤال القادم. 📜" },
                { q: "قلد شخصية كتابية والباقي يخمنها. 🎭" },
                { q: "ردد وراء المجموعة: 'أنا عبقري بس الحظ مش معايا' 3 مرات. 😂" },
                { q: "قول 3 ترانيم تبدأ بحرف معين. 🎶" },
                { q: "قف على رجل واحدة لمدة 20 ثانية. 🤸" },
                { q: "اعمل ابتسامه عريضة حتى نهاية السؤال التالي. 😁" },
                { q: "قل أسماء التلاميذ الذين تتذكرهم في 15 ثانية. ✝️" },
                { q: "صفّق 10 مرات بإيقاع منتظم. 👏" },
                { q: "اتكلم بصوت منخفض جدًا لمدة سؤال كامل. 🤫" },
                { q: "سمّع جزءًا من أي مزمور تحفظه. " },
                { q: "قل 'مبروك للفائز' وكأنك مذيع مباراة. ⚽" },
                { q: "اعمل حركة رياضية يكررها الجميع. 🏋️" },
                { q: "قل 3 معجزات للسيد المسيح. ✨" },
                { q: "تحدث كأنك طفل صغير لمدة دقيقة. 👶" },
                { q: "اذكر 5 أنبياء من العهد القديم. 👳" },
                { q: "قل ترنيمة من غير لحن والباقي يخمنها. 🎤" },
                { q: "اعمل مشية بطيئة جدًا حتى مقعدك. 🐢" },
                { q: "اذكر 3 فضائل مسيحية بسرعة. 💎" },
                { q: "قل اسم 10 أسفار في 20 ثانية. ⏱️" }
            ]
        };

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const numSegments = categories.length;
        const segmentAngle = (2 * Math.PI) / numSegments;
        let currentRotation = 0;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(180, 180);
                let startAngle = i * segmentAngle - Math.PI / 2;
                let endAngle = (i + 1) * segmentAngle - Math.PI / 2;
                ctx.arc(180, 180, 180, startAngle, endAngle);
                ctx.lineTo(180, 180);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(180, 180);
                ctx.rotate(i * segmentAngle + segmentAngle / 2 - Math.PI / 2);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px Segoe UI";
                ctx.textAlign = "right";
                ctx.fillText(categories[i], 160, 5);
                ctx.restore();
            }
        }
        drawWheel();

        function spinWheel() {
            const btn = document.getElementById("spinBtn");
            btn.disabled = true;

            const winningIndex = Math.floor(Math.random() * numSegments);
            
            // قفل الحسبة هندسياً: الوقوف في منتصف الخانة تماماً وضبط اتجاه الـ Canvas
            const targetAngle = (numSegments - winningIndex) * segmentAngle - (segmentAngle / 2);
            const extraSpins = 8 * 2 * Math.PI; 
            const totalTargetRotation = extraSpins + targetAngle;

            canvas.style.transform = `rotate(${totalTargetRotation}rad)`;
            
            let duration = 4000;
            let start = performance.now();
            let lastTickProgress = 0;
            
            function runAudioTicks(now) {
                let elapsed = now - start;
                if (elapsed < duration) {
                    let progress = elapsed / duration;
                    let currentAngleProgress = Math.floor((totalTargetRotation * (1 - Math.pow(1 - progress, 3))) / (segmentAngle / 2));
                    
                    if (currentAngleProgress !== lastTickProgress) {
                        tickSound.currentTime = 0;
                        tickSound.play().catch(e => {}); 
                        lastTickProgress = currentAngleProgress;
                    }
                    requestAnimationFrame(runAudioTicks);
                }
            }
            requestAnimationFrame(runAudioTicks);

            currentRotation = totalTargetRotation;

            setTimeout(() => {
                openQuiz(categories[winningIndex]);
                btn.disabled = false;
            }, duration); 
        }

        function openQuiz(category) {
            const modal = document.getElementById("quizModal");
            const catTitle = document.getElementById("modalCategory");
            const qText = document.getElementById("modalQuestion");
            const optionsBox = document.getElementById("modalOptions");
            const feedback = document.getElementById("modalFeedback");
            const nextBtn = document.getElementById("nextBtn");

            catTitle.innerText = `القسم المختار: ${category}`;
            feedback.innerText = "";
            optionsBox.innerHTML = "";
            nextBtn.style.display = "none";

            const questions = quizBank[category];
            if (!questions || questions.length === 0) {
                qText.innerText = "خلصت أسئلة القسم ده! لف تاني.";
                nextBtn.style.display = "block";
                modal.style.display = "flex";
                return;
            }

            const randomIndex = Math.floor(Math.random() * questions.length);
            const questionObj = questions[randomIndex];

            qText.innerText = questionObj.q;

            if (category === "ضربة حظ") {
                feedback.innerText = "نفذ التحدي المطلوب واضغط عودة للعب مجدداً!";
                feedback.style.color = "#ff9f1c";
                nextBtn.style.display = "block";
            } else {
                questionObj.options.forEach(opt => {
                    const button = document.createElement("button");
                    button.classList.add("option-btn");
                    button.innerText = opt;
                    button.onclick = () => checkAnswer(button, opt, questionObj.answer);
                    optionsBox.appendChild(button);
                });
            }

            modal.style.display = "flex";
        }

        function checkAnswer(selectedBtn, selectedOption, correctOption) {
            const allButtons = document.querySelectorAll(".option-btn");
            const feedback = document.getElementById("modalFeedback");
            const nextBtn = document.getElementById("nextBtn");

            allButtons.forEach(btn => btn.disabled = true);

            if (selectedOption === correctOption) {
                selectedBtn.classList.add("correct");
                feedback.innerText = "إجابة صحيحة! برافو عليك 🥳🎉";
                feedback.style.color = "#21bf73";
                winSound.currentTime = 0;
                winSound.play().catch(e=>{});
            } else {
                selectedBtn.classList.add("wrong");
                feedback.innerText = `إجابة خاطئة! ❌`;
                feedback.style.color = "#ff4b5c";
                loseSound.currentTime = 0;
                loseSound.play().catch(e=>{});

                allButtons.forEach(btn => {
                    if (btn.innerText === correctOption) btn.classList.add("correct");
                });
            }

            nextBtn.style.display = "block";
        }

        function closeModal() {
            document.getElementById("quizModal").style.display = "none";
            canvas.style.transition = "none";
            canvas.style.transform = `rotate(${currentRotation % (2 * Math.PI)}rad)`;
            setTimeout(() => {
                canvas.style.transition = "transform 4s cubic-bezier(0.2, 0.8, 0.1, 1)";
            }, 50);
        }
    </script>
</body>
</html>
